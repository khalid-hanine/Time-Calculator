<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Calculator</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #e2e8f0, #f8fafc);
  color: #0f172a;
}

/* Container */
.container {
  width: 900px;
  margin: 60px auto;
  padding: 40px;
  border-radius: 25px;
  background: #ffffff;
  box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

h1 {
  font-size: 36px;
  color: #2563eb;
  margin: 0;
}

/* Reset */
.reset {
  background: #ef4444;
  color: white;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

.reset:hover {
  background: #dc2626;
  transform: scale(1.05);
}

/* Inputs */
.inputs {
  display: flex;
  gap: 20px;
}

input {
  flex: 1;
  padding: 18px;
  font-size: 18px;
  border-radius: 15px;
  border: 2px solid #e2e8f0;
  text-align: center;
  outline: none;
}

input:focus {
  border-color: #60a5fa;
}

/* Add button */
.buttons {
  display: flex;
  margin-top: 25px;
}

button.add {
  flex: 1;
  padding: 18px;
  font-size: 18px;
  border-radius: 15px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: #22c55e;
  color: white;
  transition: 0.3s;
}

button.add:hover {
  background: #16a34a;
  transform: scale(1.03);
}

/* List */
.list {
  margin-top: 30px;
  max-height: 250px;
  overflow-y: auto;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  margin-bottom: 10px;
  border-radius: 15px;
  background: #f1f5f9;
}

.delete {
  background: none;
  border: none;
  color: #ef4444;
  font-size: 18px;
  cursor: pointer;
}

/* Total */
.total {
  margin-top: 30px;
  text-align: center;
  font-size: 32px;
  font-weight: bold;
  color: #0ea5e9;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {

  .container {
    width: 95%;
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
  }

  h1 {
    font-size: 24px;
  }

  .header {
    flex-direction: column;
    gap: 10px;
  }

  .inputs {
    flex-direction: column;
    gap: 10px;
  }

  input {
    font-size: 16px;
    padding: 14px;
  }

  button.add {
    font-size: 16px;
    padding: 14px;
  }

  .total {
    font-size: 24px;
  }
}
</style>

</head>

<body>

<div class="container">

  <div class="header">
    <h1>⏱️ Time Calculator</h1>
    <button class="reset" onclick="resetAll()">♻️ Reset</button>
  </div>

  <div class="inputs">
    <input type="number" id="hours" placeholder="Heures">
    <input type="number" id="minutes" placeholder="Minutes">
    <input type="number" id="count" placeholder="Nombre">
  </div>

  <div class="buttons">
    <button class="add" onclick="addTime()">➕ Ajouter</button>
  </div>

  <div class="list" id="list"></div>

  <div class="total" id="total">Total: 0h 0min</div>

</div>

<script>
let entries = JSON.parse(localStorage.getItem("times")) || [];

function save() {
  localStorage.setItem("times", JSON.stringify(entries));
}

function addTime() {
  let h = +document.getElementById("hours").value || 0;
  let m = +document.getElementById("minutes").value || 0;
  let c = +document.getElementById("count").value || 0;

  if (c <= 0) return;

  entries.push({ h, m, c });
  save();
  display();
}

function deleteItem(i) {
  entries.splice(i, 1);
  save();
  display();
}

function resetAll() {
  entries = [];
  save();
  display();
}

function display() {
  let total = 0;
  let html = "";

  entries.forEach((e, i) => {
    let min = (e.h * 60 + e.m) * e.c;
    total += min;

    html += `
      <div class="item">
        <span>${e.c} × ${e.h}h${e.m}</span>
        <button class="delete" onclick="deleteItem(${i})">✖</button>
      </div>
    `;
  });

  let h = Math.floor(total / 60);
  let m = total % 60;

  document.getElementById("list").innerHTML = html;
  document.getElementById("total").innerText = `Total: ${h}h ${m}min`;
}

display();
</script>

</body>
</html>
